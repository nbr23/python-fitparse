name: Main CI/CD Pipeline

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

    - name: Install dependencies
      run: |
        uv sync

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv

    - name: Run tests
      run: |
        uv run coverage run -m pytest && uv run coverage report -m

    - name: Smoke-test fitdump from the built wheel
      run: |
        uv build
        uvx --isolated --from "$(ls dist/*.whl)" fitdump tests/files/Activity.fit > /dev/null

  tag-version:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: nbr23/github-workflows/.github/workflows/tag-pyproject-version-bump.yml@main

  publish:
    needs: [test, tag-version]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/') ||
       needs.tag-version.outputs.tag_created == 'true')
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
